<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Liquidación</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    .container {
      padding: 1rem;
      max-width: 600px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
      color: #333;
    }

    .seccion {
      margin: 1.5rem 0;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 1rem;
      font-size: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.2rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    button:hover {
      background-color: #45a049;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th, table td {
      padding: 0.75rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .verde {
      color: green;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .rojo {
      color: darkred;
      font-weight: bold;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Liquidación de Productos</h1>

    <div class="seccion">
      <button id="cargarBtn">📦 Cargar Inventario</button>
    </div>

    <div class="seccion" id="ventaSection" style="display:none">
      <label for="producto">Producto:</label>
      <select id="producto"></select>

      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" min="1" value="1">

      <button id="agregarBtn">➕ Agregar</button>
    </div>

    <div class="seccion">
      <h2>Carrito</h2>
      <table id="carrito">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Ganancia</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="seccion">
      <p id="totalVenta" class="verde"></p>
      <p id="totalGanancia" class="rojo"></p>
      <button id="exportarPDF">📤 Exportar PDF</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
