<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquidación</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 1rem;
    }

    .banner {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      color: #222;
    }

    h2 {
      font-size: 1.5rem;
      margin-top: 1.5rem;
      text-align: center;
      color: #4CAF50;
    }

    .seccion {
      margin: 1.5rem 0;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 1rem 0 0.5rem;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 1rem;
      font-size: 1.2rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 1.2rem;
      font-size: 1.3rem;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1rem;
    }

    button:hover {
      background: #45a049;
    }

    .totales {
      margin-top: 1rem;
      font-size: 1.2rem;
      line-height: 1.6;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="banner.jpg" alt="Banner" class="banner">
    <h1>¡Hola! ¿Qué vendiste hoy?</h1>

    <div class="seccion">
      <h2>Seleccionar Productos</h2>
      <label for="producto">Producto:</label>
      <select id="producto"></select>
      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" min="1" value="1">
      <button id="agregarBtn">➕ Agregar</button>
    </div>

    <div class="seccion" id="carritoSeccion">
      <h2>Resumen de Venta</h2>
      <div id="resumen"></div>
      <button id="calcularBtn">🧮 Calcular Totales</button>
      <div class="totales" id="totales"></div>
      <button id="exportarPDF">📤 Exportar PDF</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
